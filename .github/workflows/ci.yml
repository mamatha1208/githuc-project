name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs on every PR and every push to main.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        run: pytest app/ -v

  # Runs on every PR and every push to main - proves the image builds cleanly
  # before we ever try to ship it anywhere.
  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: widget-api:${{ github.sha }}
          load: true

      - name: Save image for downstream jobs
        run: docker save widget-api:${{ github.sha }} -o /tmp/widget-api.tar

      - uses: actions/upload-artifact@v4
        with:
          name: widget-api-image
          path: /tmp/widget-api.tar
          retention-days: 1

  # Only on merge to main: scan for vulnerabilities and push to GHCR.
  # Uses the built-in GITHUB_TOKEN (OIDC-backed, short-lived) instead of a
  # long-lived PAT or hardcoded credential.
  scan-and-push:
    name: Scan and push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: widget-api-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/widget-api.tar

      - name: Scan image with Trivy (fail on criticals)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: widget-api:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/widget-api"
          docker tag widget-api:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker tag widget-api:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # Only on merge to main, only after a human approves the "production"
  # GitHub Environment. Authenticates to Azure via OIDC (no client secret
  # stored anywhere) and applies the Terraform in infra/.
  deploy:
    name: Deploy to Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scan-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=servicelink-widget-api.tfstate"

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}" \
            -var="ghcr_owner=${{ github.repository_owner }}" \
            -var="ghcr_username=${{ github.actor }}" \
            -var="ghcr_token=${{ secrets.GITHUB_TOKEN }}"
